name: Public sample validation
on: [push, pull_request]
jobs:
  synthetic-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check stockyard tests
      - run: python -m ruff format --check stockyard tests
      - run: python -m pytest -q
      - run: python -m stockyard.data.sample
      - run: python -m stockyard.training.ppo --updates 1 --horizon 16
      - run: python -m stockyard.evaluation.benchmark --methods random edd-mod sop-mfb sa aco ppo --budget-seconds 1
      - run: python -m stockyard.analysis.plot
