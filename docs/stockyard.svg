<text x="847" y="301" fill="#27766c" font-size="12" font-weight="500" text-anchor="start">Day 10 retrieved first</text>
<text x="126" y="416" fill="#65716e" font-size="14" font-weight="400" text-anchor="start">Later-due plates must be moved out of the way.</text>
<text x="729" y="416" fill="#65716e" font-size="14" font-weight="400" text-anchor="start">The earliest-due plate is accessible from the top.</text>
<line x1="46" y1="442" x2="1154" y2="442" stroke="#dcded8"/><rect x="46" y="462" width="14" height="8" rx="1" fill="#b98837"/>
