<path d="M900 224V252" stroke="#68757b" stroke-width="1.6"/><rect x="882" y="256" width="36" height="7" fill="#50676f"/><ellipse cx="900" cy="256" rx="18" ry="5" fill="#91a2a6"/><ellipse cx="900" cy="263" rx="18" ry="4" fill="#50676f"/>
