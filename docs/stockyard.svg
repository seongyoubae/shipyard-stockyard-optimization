<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Retrieval interference: blocked plate versus directly accessible plate</title>
<desc id="desc">Illustrative steel plate stacks handled by lifting magnets with top-only access. Left, the earliest-due plate, outbound day 10, is below plates with outbound days 30 and 20. These plates block retrieval. Right, plates are ordered bottom-to-top by days 30, 20, 10, so day 10 is directly accessible. This compares stacking examples, not measured algorithm results.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b8483f"/></marker>
</defs>
<rect x="1" y="1" width="1198" height="498" rx="16" fill="#fafaf7" stroke="#deded7"/>
<g font-family="Inter, Segoe UI, Arial, sans-serif">
<text x="46" y="47" font-size="12" letter-spacing="2" fill="#6b706c" font-weight="600">STEEL PLATE STOCKYARD</text>
<text x="46" y="85" font-size="29" fill="#202b2b" font-weight="600">Retrieval interference</text>
<text x="46" y="114" font-size="15" fill="#6b706c">An earlier-due plate can be blocked by the plates above it.</text>
<line x1="600" y1="152" x2="600" y2="407" stroke="#dcded8"/>

<text x="48" y="167" fill="#b8483f" font-size="12" font-weight="600" text-anchor="start">01</text>
<text x="81" y="167" fill="#263434" font-size="20" font-weight="600" text-anchor="start">Blocked retrieval</text>
<text x="650" y="167" fill="#27766c" font-size="12" font-weight="600" text-anchor="start">02</text>
<text x="683" y="167" fill="#263434" font-size="20" font-weight="600" text-anchor="start">Direct retrieval</text>
