<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Steel plate relocation with priority-aware GRU and PPO</title>
<desc id="desc">Conceptual illustration. A pile with bottom-to-top outbound days 10, 30, 20 has two blocking pairs. A reordered pile with days 30, 20, 10 has none. The policy selects source and destination subject to top-only and capacity constraints; this is not an experimental performance result.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101f36"/><stop offset="1" stop-color="#07111f"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#93a8bd"/><stop offset="1" stop-color="#526b85"/></linearGradient>
<linearGradient id="priority" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#75efdc"/><stop offset="1" stop-color="#32baa9"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#92a8c0" stroke-opacity=".045"/></pattern>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#69dbc9" stroke-width="1.5"/></marker>
</defs>
<rect width="1200" height="600" rx="20" fill="url(#bg)"/>
<rect width="1200" height="600" rx="20" fill="url(#grid)"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
<rect x="48" y="42" width="5" height="20" rx="2" fill="#65e4d0"/>
<text x="66" y="58" fill="#77a1bc" font-size="13" font-weight="600" letter-spacing="2.3">INDUSTRIAL OPERATIONS / REINFORCEMENT LEARNING</text>
<text x="48" y="112" fill="#f0f5fa" font-size="39" font-weight="700" letter-spacing="-.7">Steel plate relocation, with retrieval in mind.</text>
<text x="49" y="145" fill="#9dafc4" font-size="17">Priority-aware GRU + PPO for stockyard decision-making</text>
