<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">Example of retrieval interference in a steel plate stockyard</title>
<desc id="desc">Left: the target plate with outbound day 10 is beneath plates with days 30 and 20, so the upper plates must be moved first. Right: the target plate with day 10 is at the top and lifted by a single suspended circular magnet. Dates describe illustrative orders, not measured policy results.</desc>
<rect width="1120" height="640" rx="16" fill="#f5f7fa"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="32" y="49" font-size="32" font-weight="600" fill="#243747">Retrieval interference</text>
<text x="32" y="86" font-size="22" fill="#556571">The earliest-due plate is the target for retrieval.</text>

<g transform="translate(28 118)"><rect width="508" height="456" rx="14" fill="#ffffff" stroke="#dce3e9"/><rect x="26" y="19" width="36" height="36" rx="9" fill="#f8efed"/>
