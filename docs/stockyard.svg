<path d="M190 99V229" stroke="#4e5f69" stroke-width="1.8"/>
<path d="M180 231L162 247H218L200 231Z" fill="#8b9599" stroke="#3e4c53" stroke-width="1.5"/><ellipse cx="190" cy="248" rx="28" ry="8" fill="#a58a42" stroke="#3e4c53" stroke-width="1.5"/><path d="M180 231V245M200 231V245" stroke="#526269"/>
