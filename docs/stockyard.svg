<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
<title id="title">Example of steel plate retrieval interference</title>
<desc id="desc">Two illustrative stacking orders, not algorithm outputs. Left pile, bottom-to-top: outbound days 10, 30, 20. Day 10 is buried below two later-due plates, yielding two blocking pairs. Right pile, bottom-to-top: days 30, 20, 10. Earlier-due plates are accessible, yielding zero blocking pairs.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#112039"/><stop offset="1" stop-color="#091321"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#93a8bd"/><stop offset="1" stop-color="#526b85"/></linearGradient>
<linearGradient id="priority" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#75efdc"/><stop offset="1" stop-color="#32baa9"/></linearGradient>
</defs>
<rect width="1100" height="480" rx="18" fill="url(#bg)"/>
<g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif">
<rect x="40" y="36" width="4" height="21" rx="2" fill="#65e4d0"/>
<text x="57" y="53" fill="#ecf3fa" font-size="25" font-weight="600">What causes retrieval interference?</text>
<text x="40" y="84" fill="#9dafc4" font-size="15">An earlier-due plate is blocked when later-due plates are stacked above it.</text>
<line x1="40" y1="106" x2="1060" y2="106" stroke="#28394e"/>
<line x1="550" y1="133" x2="550" y2="402" stroke="#28394e"/>

<text x="269" y="155" fill="#dce8f4" font-size="14" font-weight="600" text-anchor="middle">INTERFERENCE</text>
<ellipse cx="269" cy="340" rx="166" ry="17" fill="#000000" opacity=".22"/>
<path d="M118 299l48 -25h254l-48 25z" fill="#8bf0df" stroke="#ffffff" stroke-opacity=".12"/><path d="M372 299l48 -25v33l-48 25z" fill="#218e86"/><rect x="118" y="299" width="254" height="33" rx="1" fill="url(#priority)"/>
<text x="133" y="321" fill="#083c3b" font-size="10" font-weight="600" text-anchor="start">OUTBOUND DAY</text>
<text x="356" y="323" fill="#083c3b" font-size="20" font-weight="700" text-anchor="end">10</text>
<path d="M118 248l48 -25h254l-48 25z" fill="#a8bccb" stroke="#ffffff" stroke-opacity=".12"/><path d="M372 248l48 -25v33l-48 25z" fill="#40586f"/><rect x="118" y="248" width="254" height="33" rx="1" fill="url(#steel)"/>
<text x="133" y="270" fill="#f5f9fc" font-size="10" font-weight="600" text-anchor="start">OUTBOUND DAY</text>
<text x="356" y="272" fill="#f5f9fc" font-size="20" font-weight="700" text-anchor="end">30</text>
<path d="M118 197l48 -25h254l-48 25z" fill="#a8bccb" stroke="#ffffff" stroke-opacity=".12"/><path d="M372 197l48 -25v33l-48 25z" fill="#40586f"/><rect x="118" y="197" width="254" height="33" rx="1" fill="url(#steel)"/>
<text x="133" y="219" fill="#f5f9fc" font-size="10" font-weight="600" text-anchor="start">OUTBOUND DAY</text>
<text x="356" y="221" fill="#f5f9fc" font-size="20" font-weight="700" text-anchor="end">20</text>
<text x="269" y="374" fill="#9db3c7" font-size="13" font-weight="400" text-anchor="middle">Day 10 is buried below later-due plates</text>
<text x="269" y="403" fill="#d0ddea" font-size="17" font-weight="600" text-anchor="middle">2 blocking pairs</text>
<text x="819" y="155" fill="#dce8f4" font-size="14" font-weight="600" text-anchor="middle">NO INTERFERENCE</text>
<ellipse cx="819" cy="340" rx="166" ry="17" fill="#000000" opacity=".22"/>
<path d="M668 299l48 -25h254l-48 25z" fill="#a8bccb" stroke="#ffffff" stroke-opacity=".12"/><path d="M922 299l48 -25v33l-48 25z" fill="#40586f"/><rect x="668" y="299" width="254" height="33" rx="1" fill="url(#steel)"/>
<text x="683" y="321" fill="#f5f9fc" font-size="10" font-weight="600" text-anchor="start">OUTBOUND DAY</text>
<text x="906" y="323" fill="#f5f9fc" font-size="20" font-weight="700" text-anchor="end">30</text>
<path d="M668 248l48 -25h254l-48 25z" fill="#a8bccb" stroke="#ffffff" stroke-opacity=".12"/><path d="M922 248l48 -25v33l-48 25z" fill="#40586f"/><rect x="668" y="248" width="254" height="33" rx="1" fill="url(#steel)"/>
<text x="683" y="270" fill="#f5f9fc" font-size="10" font-weight="600" text-anchor="start">OUTBOUND DAY</text>
<text x="906" y="272" fill="#f5f9fc" font-size="20" font-weight="700" text-anchor="end">20</text>
<path d="M668 197l48 -25h254l-48 25z" fill="#8bf0df" stroke="#ffffff" stroke-opacity=".12"/><path d="M922 197l48 -25v33l-48 25z" fill="#218e86"/><rect x="668" y="197" width="254" height="33" rx="1" fill="url(#priority)"/>
<text x="683" y="219" fill="#083c3b" font-size="10" font-weight="600" text-anchor="start">OUTBOUND DAY</text>
<text x="906" y="221" fill="#083c3b" font-size="20" font-weight="700" text-anchor="end">10</text>
<text x="819" y="374" fill="#9db3c7" font-size="13" font-weight="400" text-anchor="middle">Earlier-due plates are accessible</text>
<text x="819" y="403" fill="#65e4d0" font-size="17" font-weight="600" text-anchor="middle">0 blocking pairs</text>
<line x1="40" y1="429" x2="1060" y2="429" stroke="#28394e"/><circle cx="47" cy="455" r="5" fill="#65e4d0"/>
<text x="63" y="460" fill="#aabdcf" font-size="12" font-weight="400" text-anchor="start">Highlighted plate: earliest outbound day</text>
<text x="1060" y="460" fill="#728ba5" font-size="11" font-weight="500" text-anchor="end">ILLUSTRATIVE STACKING ORDERS</text>
</g></svg>
